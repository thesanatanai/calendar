name: Build Sanatan Calendar

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - platform: windows
            os: windows-latest
            args: "--bundles nsis"

          # Linux
          - platform: linux
            os: ubuntu-24.04
            args: "--bundles appimage,deb"

          # macOS Intel
          - platform: macos-intel
            os: macos-13
            args: "--bundles dmg"

          # macOS Apple Silicon
          - platform: macos-arm
            os: macos-14
            args: "--bundles dmg"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Linux system dependencies required by Tauri
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libglib2.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Sanatan Calendar ${{ github.ref_name }}"
          releaseBody: "Sanatan Calendar desktop release."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
